name: polish-trip-ui
on:
  push:
    paths:
      - '.github/workflows/polish-trip-ui.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = r'''
/* FINAL UI POLISH */
:root{--ui-accent:#18a5b8;--ui-paper:#f7f6f1;--ui-ink:#15191b;--ui-muted:#697176;--ui-hair:#d7d8d3}
body{font-size:15px;background:#e7e7e3;color:var(--ui-ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}.page{background:#fff}.head{min-height:62px;height:auto;padding:11px 16px;gap:10px}.menu{padding:7px 8px;font-size:12px;letter-spacing:.02em}.title{font-size:15px;line-height:1.3;letter-spacing:-.015em}.date{font-size:11px;color:#70777b}.status{padding:6px 9px;font-size:11px;background:#f1f3f1}.nav{border-top:1px solid var(--ui-hair)}.nav a{padding:11px 18px;font-size:13px;font-weight:500;color:#555d61;border-right:1px solid #e0e1dd}.nav a:hover,.nav a:focus{color:var(--ui-ink);background:#f6f6f3}.section{padding:28px 18px;border-bottom:1px solid #202326}.label{font-size:11px;letter-spacing:.16em;margin-bottom:9px}h1{font-size:38px;line-height:1.08;margin-bottom:7px}h2{font-size:27px;line-height:1.15;margin-bottom:15px}h3{font-size:17px;line-height:1.35}p{font-size:14px;line-height:1.75;margin:7px 0;color:#4f575b}.meta{font-size:12px;line-height:1.55;color:#70777b}.box{padding:15px}.placeholder{height:150px;font-size:13px}.overview-cell{padding:13px;min-height:78px}.overview-cell b{font-size:21px}.overview-cell span{font-size:11px;margin-top:5px}.flight-card{padding:18px}.transport-no{font-size:14px}.transport-no small{font-size:11px}.flight-route{margin:18px 0}.flight-route strong{font-size:30px}.flight-route small{font-size:12px;line-height:1.55}.flight-dots{font-size:12px}.route-day{padding:14px;margin-bottom:11px}.route-head b{font-size:15px}.route-head span{font-size:11px}.stop{min-width:92px;font-size:12px}.pin{width:28px;height:28px}.day{padding:18px 0}.day-head{margin-bottom:9px}.day-num{font-size:14px}.city{font-size:12px}.item{grid-template-columns:62px 1fr;gap:10px;padding:10px 0}.time{font-size:13px}.item b{font-size:15px;line-height:1.45}.item span{font-size:13px;line-height:1.65}.note{padding:12px;margin-top:10px;font-size:13px;line-height:1.7}.car-card{padding:16px}.car-row{grid-template-columns:76px 1fr;padding:10px 0;font-size:13px}.day-route{padding:10px 11px;margin:9px 0 4px;font-size:12px;line-height:1.65}.day-route span{font-size:9px}.add-one{padding:13px;font-size:14px}.checkgroup{padding:14px;margin-bottom:10px}.checkgroup h3{font-size:17px;margin-bottom:4px}.check{gap:9px;padding:10px 0;font-size:15px;min-height:44px;position:relative;overflow:visible}.check input{width:20px;height:20px;flex:0 0 auto}.check span{font-size:15px;line-height:1.5;display:block;flex:1}.swipe-row{position:relative;touch-action:pan-y;transition:transform .2s ease;background:#fff;will-change:transform;z-index:1;overflow:visible}.swipe-row::after{display:none}.swipe-delete{position:absolute;right:-76px;top:0;width:76px;height:100%;border:0;background:#d94a45;color:#fff;font:inherit;font-size:14px;font-weight:600;display:grid;place-items:center;cursor:pointer;z-index:0}.swipe-row.is-open{z-index:3}.overview-map{margin-top:34px;border-top:1px solid #1e2325;border-bottom:1px solid #1e2325}.map-head{height:50px;padding:0 3px;font-size:11px;letter-spacing:.18em;color:#737b7f}.map-head button{font-size:11px}.map-stage{height:360px;background-color:#f1f1ed;background-image:linear-gradient(rgba(20,28,30,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(20,28,30,.045) 1px,transparent 1px),radial-gradient(circle at 18% 22%,rgba(24,165,184,.10),transparent 26%),radial-gradient(circle at 78% 74%,rgba(0,0,0,.04),transparent 28%);background-size:36px 36px,36px 36px,100% 100%,100% 100%;border:0;position:relative}.map-stage:after{content:'SOUTH PACIFIC · AUSTRALIA';position:absolute;left:16px;top:14px;font-size:9px;letter-spacing:.16em;color:#9aa1a3;pointer-events:none}.australia-map{position:absolute;width:88%;height:94%;left:6%;top:3%;overflow:visible}.australia-map .land{fill:#dfe3df;stroke:#8f9a9a;stroke-width:1.5}.australia-map .route-main{fill:none;stroke:var(--ui-accent);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 0 rgba(0,0,0,.08))}.australia-map .route-flight{fill:none;stroke:#555f63;stroke-width:1.6;stroke-dasharray:5 7;stroke-linecap:round}.city-dot circle{fill:#fff;stroke:#111;stroke-width:2.2}.city-dot text{font-size:15px;fill:#111;font-weight:600}.city-dot{transition:opacity .2s,transform .2s}.map-stage[data-city="melbourne"] .city-dot:not(.melbourne-dot),.map-stage[data-city="sydney"] .city-dot:not(.sydney-dot),.map-stage[data-city="cairns"] .city-dot:not(.cairns-dot){opacity:.18}.map-stage[data-city="melbourne"] .melbourne-dot,.map-stage[data-city="sydney"] .sydney-dot,.map-stage[data-city="cairns"] .cairns-dot{transform:scale(1.08);transform-origin:center}.map-caption{right:16px;bottom:16px;font-size:10px;color:#777;letter-spacing:.08em}.map-scale{left:16px;bottom:16px;font-size:9px;letter-spacing:.16em}.city-list{border-bottom:1px solid #202326}.city-item{min-height:88px;padding:16px 14px 16px 0}.city-item .city-no{font-size:10px}.city-item strong{font-size:15px}.city-item small{font-size:10px}.city-item em{font-size:16px}.memory-note{font-size:12px}.memory-title b{font-size:12px}.memory-title span,.memory-title small{font-size:10px}.drawer-kicker{font-size:10px}.drawer-title{font-size:21px}.drawer-close{width:36px;height:36px}.drawer-item{padding:17px 8px}.drawer-item .drawer-date{font-size:10px}.drawer-item strong{font-size:14px}.drawer-item span{font-size:11px}.drawer-footer{font-size:10px}.modal{padding:20px 18px 22px}.modal-head h3{font-size:18px}.form-row label{font-size:11px}.form-row select,.form-row input{padding:12px;font-size:14px}.modal-actions button{padding:13px;font-size:14px}.expense-head h3{font-size:18px}.expense-head p{font-size:12px}.expense-summary{padding:15px}.expense-total-label{font-size:10px}.expense-total-value{font-size:26px}.expense-rmb .expense-total-value{font-size:22px}.expense-row{grid-template-columns:72px 1fr auto;padding:13px 12px;font-size:13px}.expense-amount{font-size:14px}.expense-remove{font-size:18px}.expense-add{padding:13px;font-size:14px}.expense-note,.expense-subtotals{font-size:11px}@media(min-width:800px){.section{padding:38px 44px}.head{min-height:68px;padding:12px 20px}.title{font-size:16px}.nav a{padding:12px 28px;font-size:13px}h1{font-size:44px}h2{font-size:30px}.map-stage{height:430px}.check span,.check{font-size:14px}.item b{font-size:14px}.item span{font-size:12px}}@media(max-width:700px){.head{padding:10px 12px}.title{font-size:14px}.date{display:none}.status{font-size:11px;padding:6px 8px}.nav a{padding:11px 15px;font-size:13px}.section{padding:26px 16px}h1{font-size:34px}h2{font-size:25px}.map-stage{height:330px}.australia-map{width:100%;left:0}.city-list{grid-template-columns:repeat(2,1fr)}.city-item{border-bottom:1px solid var(--ui-hair)}.city-item:nth-child(2n){border-right:0}.city-item strong{font-size:14px}.checkgroup{padding:13px}.check span,.check{font-size:15px}.item{grid-template-columns:58px 1fr}.item b{font-size:15px}.item span{font-size:13px}.expense-row{grid-template-columns:58px 1fr auto}}
'''
          s=s.replace('</style>',css+'\n</style>',1)
          s=s.replace('可直接修改；左滑删除。新增时选择类型并填写具体物品。','可直接修改；左滑后点击「删除」。新增时选择类型并填写具体物品。')
          new='''function bindSwipe(row){\n  if(!row.querySelector('.swipe-delete')){\n    const del=document.createElement('button');del.type='button';del.className='swipe-delete';del.textContent='删除';del.setAttribute('aria-label','删除准备项');\n    del.addEventListener('click',e=>{e.stopPropagation();row.remove();savePrep();});row.appendChild(del);\n  }\n  let startX=0,startY=0,current=0,locked=false;\n  row.addEventListener('touchstart',e=>{const t=e.touches[0];startX=t.clientX;startY=t.clientY;current=0;locked=false;},{passive:true});\n  row.addEventListener('touchmove',e=>{const t=e.touches[0],dx=t.clientX-startX,dy=t.clientY-startY;if(!locked&&(Math.abs(dx)>8||Math.abs(dy)>8))locked=Math.abs(dx)>Math.abs(dy);if(locked&&dx<0){current=Math.max(dx,-76);row.style.transform=`translateX(${current}px)`;}},{passive:true});\n  row.addEventListener('touchend',()=>{if(locked&&current<-44){row.style.transform='translateX(-76px)';row.classList.add('is-open');}else if(locked){row.style.transform='';row.classList.remove('is-open');}});\n}'''
          s2,n=re.subn(r'function bindSwipe\(row\)\{.*?\n\}\ndocument\.querySelectorAll\(\'.checkgroup\'',new+"\ndocument.querySelectorAll('.checkgroup'",s,count=1,flags=re.S)
          if n!=1: raise SystemExit('bindSwipe block not found')
          s=s2
          s=s.replace('fxToRmb={CNY:1,AUD:4.8,USD:7.2,SGD:5.4,EUR:8.4,JPY:0.046,GBP:9.7}', 'fxToRmb={CNY:1,AUD:4.8,USD:7.2,SGD:5.4,EUR:8.4,JPY:0.046,GBP:9.7,TRY:0.22}')
          s=s.replace("const fxToRmb={CNY:1,AUD:4.8,USD:7.2,SGD:5.4,EUR:8.4,JPY:0.046,GBP:9.7};", "const fxToRmb={CNY:1,AUD:4.8,USD:7.2,SGD:5.4,EUR:8.4,JPY:0.046,GBP:9.7,TRY:0.22};")
          if "TRY:'TRY 里拉'" not in s:s=s.replace("GBP:'GBP 英镑'", "GBP:'GBP 英镑',TRY:'TRY 里拉'")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Polish mobile UI, map and prep swipe delete"
          git push
