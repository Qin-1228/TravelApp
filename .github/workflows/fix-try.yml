name: Fix TRY conversion
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add TRY conversion
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="fxToRmb={CNY:1,AUD:4.8,USD:7.2,SGD:5.4,EUR:8.4,JPY:0.046,GBP:9.7}"
          new="fxToRmb={CNY:1,AUD:4.8,USD:7.2,SGD:5.4,EUR:8.4,JPY:0.046,GBP:9.7,TRY:0.22}"
          if old not in s:
              raise SystemExit('TRY conversion target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add TRY conversion rate'
          git push
