name: Repair interactions
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/repair-interactions.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair interaction initialization
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const statusEl=document.getElementById('status'),memoryTab=document.getElementById('memoryTab'),memorySection=document.getElementById('memories');"
          new="const statusEl=document.getElementById('overview-status'),memoryTab=document.getElementById('memoryTab'),memorySection=document.getElementById('memories');"
          if old not in s:
              raise SystemExit('status initializer not found')
          s=s.replace(old,new,1)
          # The old header status element was intentionally removed; the mirror observer is now unnecessary.
          marker="(function(){const old=document.getElementById('status');const neo=document.getElementById('overview-status');if(old&&neo){const sync=()=>{neo.textContent=old.textContent};sync();new MutationObserver(sync).observe(old,{childList:true,characterData:true,subtree:true,attributes:true)}}})();"
          s=s.replace(marker,'',1)
          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/travelapp.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/travelapp.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore travel app interactions' || exit 0
          git push
