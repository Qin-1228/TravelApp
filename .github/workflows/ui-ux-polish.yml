name: UI UX polish
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css=r'''
          /* FINAL UX POLISH */
          :root{scroll-padding-top:104px}
          .section{scroll-margin-top:104px}
          .nav a{position:relative;transition:background .18s ease,color .18s ease,transform .12s ease}
          .nav a::after{content:'';position:absolute;left:22%;right:22%;bottom:0;height:2px;background:#111;transform:scaleX(0);transform-origin:center;transition:transform .2s ease}
          .nav a.nav-current::after{transform:scaleX(1)}
          .nav a:active{transform:scale(.97)}
          button,.menu{ -webkit-tap-highlight-color:transparent }
          .city-item,.map-filter,.add-one,.modal-actions button,.drawer-close,.pdf-viewer-head button,.expense-add{transition:background .18s ease,color .18s ease,transform .12s ease,border-color .18s ease}
          .city-item:active,.map-filter:active,.add-one:active,.modal-actions button:active,.drawer-close:active,.pdf-viewer-head button:active,.expense-add:active{transform:scale(.985)}
          .map-stage{background-color:#f4f4f1;background-image:linear-gradient(rgba(35,72,75,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(35,72,75,.055) 1px,transparent 1px),radial-gradient(circle at 15% 75%,rgba(29,139,145,.08),transparent 30%),radial-gradient(circle at 82% 22%,rgba(29,139,145,.06),transparent 28%);background-size:32px 32px,32px 32px,100% 100%,100% 100%;border:0}
          .australia-map{width:100%;height:100%;display:block;filter:drop-shadow(0 5px 8px rgba(25,52,55,.06));transform:scale(1.02);transition:transform .45s ease,filter .35s ease}
          .australia-map .land{fill:#e7e8e3;stroke:#aeb7b3;stroke-width:1.4}
          .australia-map .route{fill:none;stroke:#147c82;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:opacity .35s ease,stroke-width .25s ease}
          .australia-map .route-flight{stroke-dasharray:5 5;stroke-width:1.5;opacity:.7}
          .australia-map .city-dot circle{fill:#fff;stroke:#147c82;stroke-width:2;transition:r .25s ease,fill .25s ease,stroke-width .25s ease}
          .australia-map .city-dot text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",Arial,sans-serif;font-size:13px;fill:#253638;font-weight:600}
          .map-stage[data-city="melbourne"] .melbourne-dot circle,.map-stage[data-city="sydney"] .sydney-dot circle,.map-stage[data-city="cairns"] .cairns-dot circle{fill:#147c82;stroke:#fff;stroke-width:2.5}
          .map-stage[data-city="melbourne"] .melbourne-dot circle,.map-stage[data-city="sydney"] .sydney-dot circle,.map-stage[data-city="cairns"] .cairns-dot circle{r:8}
          .map-stage[data-city="melbourne"] .australia-map,.map-stage[data-city="sydney"] .australia-map,.map-stage[data-city="cairns"] .australia-map{transform:scale(1.04)}
          .map-stage .map-caption{background:rgba(244,244,241,.82);padding:4px 7px;backdrop-filter:blur(4px)}
          .map-head .map-filter{padding:7px 10px;border:1px solid transparent;border-radius:999px}
          .map-head .map-filter.active{border-color:#b9c5c2;background:#eef3f1;color:#147c82}
          .city-item.active{background:#f0f4f2}
          .city-item.active strong{font-weight:650}
          .check{position:relative;overflow:visible;transform:translateX(0);transition:transform .2s ease;background:#fff;z-index:1}
          .swipe-row{touch-action:pan-y;will-change:transform}
          .swipe-delete-btn{position:absolute;right:-76px;top:0;width:76px;height:100%;border:0;border-radius:0;background:#c83b32;color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;z-index:0}
          .swipe-row.is-open{z-index:4}
          .swipe-row.is-open .swipe-delete-btn{z-index:5}
          .swipe-row input,.swipe-row span{position:relative;z-index:2}
          .swipe-hint{font-size:11px!important;color:#999!important;margin-top:7px!important}
          .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,12px);z-index:120;background:#202020;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;line-height:1;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;box-shadow:0 8px 24px rgba(0,0,0,.18)}
          .toast.show{opacity:1;transform:translate(-50%,0)}
          .expense-row{transition:background .18s ease,transform .18s ease}
          .expense-row:active{background:#f3f5f4}
          .expense-remove{width:30px;height:30px;border-radius:50%;transition:background .15s ease,transform .12s ease}
          .expense-remove:active{background:#eee;transform:scale(.92)}
          @media(max-width:700px){
            body{font-size:15px}
            .head{height:64px;padding:0 14px;gap:9px}
            .menu{font-size:11px;padding:7px 8px}
            .title{font-size:15px;line-height:1.28}
            .date{font-size:11px}
            .status{font-size:11px;padding:6px 9px}
            .nav a{padding:11px 17px;font-size:13px;min-height:44px;display:flex;align-items:center;justify-content:center}
            .section{padding:28px 18px}
            .label{font-size:11px;margin-bottom:9px}
            h1{font-size:34px}
            h2{font-size:25px;line-height:1.25}
            h3{font-size:18px}
            p{font-size:14px;line-height:1.7}
            .meta{font-size:11px;line-height:1.6}
            .day-head{margin-bottom:10px}.day-num{font-size:13px}.city{font-size:12px}
            .day-route{font-size:13px;line-height:1.65;padding:10px 11px}.day-route span{font-size:9px}
            .item{grid-template-columns:58px 1fr;gap:10px;padding:10px 0}.time{font-size:13px}.item b{font-size:15px;line-height:1.45}.item span{font-size:13px;line-height:1.65}
            .note{font-size:13px;line-height:1.7;padding:11px}
            .checkgroup{padding:12px;margin-bottom:10px}.check{gap:9px;padding:10px 0;font-size:15px;line-height:1.45}.check input{width:20px;height:20px;flex:0 0 20px}.check span{font-size:15px}.add-one{padding:13px;font-size:14px}
            .map-stage{height:300px}.map-head{height:48px;font-size:11px}.city-list{grid-template-columns:1fr 1fr}.city-item{min-height:82px;padding:13px 9px 13px 0}.city-item strong{font-size:13px}.city-item small{font-size:10px}.city-item .city-no{font-size:10px}
            .transport-no{font-size:14px}.flight-route strong{font-size:29px}.flight-route small{font-size:12px}.flight-card{padding:16px}.flight-card p{font-size:13px}
            .expense-head h3{font-size:18px}.expense-head p{font-size:12px}.expense-total-label{font-size:10px}.expense-total-value{font-size:27px}.expense-rmb .expense-total-value{font-size:23px}.expense-row{grid-template-columns:58px 1fr auto;padding:12px 10px}.expense-currency,.expense-detail,.expense-amount{font-size:14px}.expense-add{padding:13px;font-size:14px}
            .modal{padding:20px 18px 24px}.modal-head h3{font-size:19px}.form-row label{font-size:12px}.form-row select,.form-row input{padding:13px;font-size:15px}.modal-actions button{padding:13px;font-size:14px}
            .drawer-title{font-size:21px}.drawer-kicker{font-size:10px}.drawer-item strong{font-size:14px}.drawer-item .drawer-date{font-size:10px}.drawer-item span{font-size:11px}.drawer-empty{font-size:13px}
          }
          @media(min-width:701px){.section{padding-top:38px;padding-bottom:38px}.nav a{font-size:12px}.item b{font-size:12px}.item span{font-size:11px}.day-num{font-size:12px}}
          '''
          js=r'''
          /* Interaction layer: navigation, map transitions, swipe-delete and feedback */
          (function(){
            const toast=document.createElement('div');toast.className='toast';document.body.appendChild(toast);
            let toastTimer;
            window.travelToast=function(msg){clearTimeout(toastTimer);toast.textContent=msg;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),1500)};

            const navLinks=[...document.querySelectorAll('.nav a')].filter(a=>!a.classList.contains('hidden'));
            navLinks.forEach(a=>a.addEventListener('click',e=>{const id=a.getAttribute('href');if(!id||id[0]!=='#')return;const target=document.querySelector(id);if(!target)return;e.preventDefault();const header=document.querySelector('.header');const top=target.getBoundingClientRect().top+window.scrollY-(header?header.getBoundingClientRect().height+8:8);window.scrollTo({top,behavior:'smooth'});history.replaceState(null,'',id)}));
            const sections=navLinks.map(a=>document.querySelector(a.getAttribute('href'))).filter(Boolean);
            const navIO=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){const a=navLinks.find(x=>x.getAttribute('href')==='#'+entry.target.id);navLinks.forEach(x=>x.classList.remove('nav-current'));if(a)a.classList.add('nav-current')}})},{rootMargin:'-28% 0px -62% 0px',threshold:0});sections.forEach(x=>navIO.observe(x));

            const mapStage=document.getElementById('overviewMap');
            document.querySelectorAll('.city-item,.map-filter').forEach(btn=>btn.addEventListener('click',()=>{if(!mapStage)return;const city=btn.dataset.city;if(city)mapStage.dataset.city=city;document.querySelectorAll('.city-item,.map-filter').forEach(x=>x.classList.toggle('active',x.dataset.city===city));if(btn.classList.contains('city-item')){btn.animate([{transform:'translateY(2px)'},{transform:'translateY(0)'}],{duration:180,easing:'ease-out'});}}));

            function closePrepRows(except){document.querySelectorAll('.swipe-row.is-open').forEach(r=>{if(r!==except){r.classList.remove('is-open');r.style.transform='';}})}
            window.bindSwipe=function(row){
              if(!row||row.dataset.swipeBound==='1')return;row.dataset.swipeBound='1';
              let sx=0,sy=0,current=0,locked=false,moved=false;
              let del=row.querySelector('.swipe-delete-btn');
              if(!del){del=document.createElement('button');del.type='button';del.className='swipe-delete-btn';del.textContent='删除';del.setAttribute('aria-label','删除准备项');row.appendChild(del);}
              const open=()=>{closePrepRows(row);row.classList.add('is-open');row.style.transform='translateX(-76px)';current=-76};
              const close=()=>{row.classList.remove('is-open');row.style.transform='';current=0};
              del.addEventListener('click',e=>{e.stopPropagation();row.style.transform='translateX(-76px)';setTimeout(()=>{row.remove();savePrep();travelToast('已删除准备项')},80)});
              row.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;current=row.classList.contains('is-open')?-76:0;locked=false;moved=false},{passive:true});
              row.addEventListener('touchmove',e=>{const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(!locked&&(Math.abs(dx)>8||Math.abs(dy)>8)){locked=Math.abs(dx)>Math.abs(dy);moved=true}if(locked&&dx<0){current=Math.max(-76,Math.min(0,(row.classList.contains('is-open')?-76:0)+dx));row.style.transform=`translateX(${current}px)`}},{passive:true});
              row.addEventListener('touchend',e=>{if(!locked)return;if(current<-38)open();else close();});
              row.addEventListener('click',e=>{if(e.target.closest('.swipe-delete-btn'))return;if(row.classList.contains('is-open')){close();e.preventDefault();}});
            };
            document.querySelectorAll('.checkgroup .check').forEach(old=>{const row=old.cloneNode(true);old.replaceWith(row);row.querySelector('input').addEventListener('change',savePrep);row.querySelector('span').addEventListener('blur',savePrep);bindSwipe(row)});
            document.addEventListener('touchstart',e=>{if(!e.target.closest('.swipe-row'))closePrepRows(null)},{passive:true});

            const originalAppend=window.appendPrepRow;
            if(typeof originalAppend==='function'){
              window.appendPrepRow=function(group,text,checked=false){originalAppend(group,text,checked);const row=group.querySelector('.check:last-child');if(row){const fresh=row.cloneNode(true);row.replaceWith(fresh);fresh.querySelector('input').addEventListener('change',savePrep);fresh.querySelector('span').addEventListener('blur',savePrep);bindSwipe(fresh)}};
            }
            const addPrep=document.getElementById('addPrep');if(addPrep)addPrep.addEventListener('click',()=>travelToast('选择分类后添加准备项'));

            const originalSaveExpenses=window.saveExpenses;
            if(typeof originalSaveExpenses==='function')window.saveExpenses=function(){originalSaveExpenses();travelToast('记账已更新')};
            document.addEventListener('click',e=>{if(e.target.closest('.expense-remove'))setTimeout(()=>travelToast('已删除消费记录'),40)});
          })();
          '''
          if '/* FINAL UX POLISH */' not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          if '/* Interaction layer: navigation, map transitions, swipe-delete and feedback */' not in s:
              s=s.replace('</script>','\n'+js+'\n</script>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Polish mobile UX, map transitions and interaction feedback'
          git push
