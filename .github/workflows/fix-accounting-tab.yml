name: Fix accounting tab
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add accounting tab
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<a href="#overview">概览</a><a href="#transport">交通</a><a href="#itinerary">行程</a><a href="#prep">准备</a><a href="#memories" id="memoryTab" class="hidden">回忆</a>'
          new = '<a href="#overview">概览</a><a href="#transport">交通</a><a href="#itinerary">行程</a><a href="#prep">准备</a><a href="#expenses">记账</a><a href="#memories" id="memoryTab" class="hidden">回忆</a>'
          if old not in s:
              raise SystemExit('target nav markup not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add accounting tab to navigation'
          git push
